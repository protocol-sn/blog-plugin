micronaut:
  server:
    port: 8080
    context-path: /blog
  security:
    oauth2:
      clients:
        keycloak:
          client-id: blog-plugin
          client-secret: blog-plugin-secret
          openid:
            issuer: http://keycloak.psn.local:5005/auth/realms/social-network-ecosystem
    endpoints:
      logout:
        get-allowed: true
    authentication: idtoken

coop:
  stlma:
    tech:
      protocolsn:
        plugin-name: ProtocolSNBlogPlugin
        plugin-target: dns:///psn-blog-plugin:50051

datasources:
  default:
    driver-class-name: org.postgresql.Driver
    jdbc-url: jdbc:postgresql://db:5432/blogplugin
    username: ${JDBC_USER:postgres}
    password: ${JDBC_PASSWORD:postgres}
    dialect: POSTGRES

grpc:
  server:
    port: 50051
  channels:
    node-manager:
      plaintext: true
      target: psn-node-manager:50051

logger:
  levels:
    io.micronaut.http: TRACE
    io.micronaut.security: DEBUG