micronaut:
  application:
    name: ProtocolSNBlogPlugin
  server:
    cors:
      enabled: true
    port: 8082
    context-path: /
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        mapping: /swagger-ui/**
        paths: classpath:META-INF/swagger/views/swagger-ui
  security:
    oauth2:
      clients:
        keycloak:
          client-id: blog-plugin
          client-secret: blog-plugin-secret
          openid:
            issuer: http://localhost:9080/realms/social-network-ecosystem
        keycloak-client:
          client-id: blog-plugin
          client-secret: blog-plugin-secret
          grant-type: client_credentials
          token:
            url: http://localhost:9080/realms/social-network-ecosystem/protocol/openid-connect/token
            auth-method: client_secret_post
          client-credentials:
            service-id-regex: node-manager::registration
          openid:
            issuer: http://localhost:9080/realms/social-network-ecosystem
    endpoints:
      logout:
        get-allowed: true
    authentication: bearer
    intercept-url-map:
      - pattern: /swagger/**
        access: isAnonymous()
      - pattern: /swagger-ui/**
        access: isAnonymous()
  openapi:
    enabled: true

coop:
  stlma:
    tech:
      protocolsn:
        plugin-name: ProtocolSNBlogPlugin
        plugin-host: localhost
        plugin-grpc-port: 8092

logger:
  levels:
    io.micronaut.http: TRACE

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: none

flyway:
  datasources:
    default:
      enabled: true
      locations: db/migrations

datasources:
  default:
    driver-class-name: org.postgresql.Driver
    jdbc-url: jdbc:postgresql://localhost:5443/blogplugin
    username: ${JDBC_USER:postgres}
    password: ${JDBC_PASSWORD:postgres}
    dialect: POSTGRES

grpc:
  server:
    port: 8092
  channels:
    node-manager:
      plaintext: true
      target: localhost:8090