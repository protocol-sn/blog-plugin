micronaut:
  server:
    port: 8080
    context-path: /blog
    cors:
      enabled: true
  security:
    oauth2:
      clients:
        keycloak:
          openid:
            issuer: https://${KEYCLOAK_HOST}/realms/social-network-ecosystem

coop:
  stlma:
    tech:
      protocolsn:
        plugin-name: ProtocolSNBlogPlugin
        plugin-target: dns:///${BLOG_PLUGIN_HOST}:${BLOG_PLUGIN_GRPC_PORT}

grpc:
  server:
    port: ${BLOG_PLUGIN_GRPC_PORT}
  channels:
    node-manager:
      address: ${NODE_MANAGER_HOST}
      plaintext: true

datasources:
  default:
    driver-class-name: org.postgresql.Driver
    jdbc-url: ${JDBC_URL:jdbc:postgresql://ecosystem-psql.flycast:5432/blogplugin?sslmode=disable}
    username: ${JDBC_USER}
    password: ${JDBC_PASSWORD}
    dialect: POSTGRES