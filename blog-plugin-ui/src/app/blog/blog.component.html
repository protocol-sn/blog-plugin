<div class="grid-container">
  <div *ngFor="let thisBlog of blogsToShow" style="padding-bottom: 15px">
    <app-blog-card [title]="thisBlog.blogTitle ? thisBlog.blogTitle : ''" [postDate]="thisBlog.updatedAt" [tags]="splitTags(thisBlog.tags)">
      {{thisBlog.blogText}}
    </app-blog-card>
  </div>
</div>
