<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
               [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
               [mode]="(isHandset$ | async) ? 'over' : 'side'"
               [opened]="(isHandset$ | async) === false">
    <mat-toolbar>
<!--      <img style="padding-top: 15px" width="100px" src="assets/citAbbyLogo.png" alt="Citizen Abacus logo"/>-->
    </mat-toolbar>
    Blogs
    <mat-nav-list>
      <a mat-list-item *ngFor="let blogMeta of blogMetas" [href]="'/blog/'+blogMeta.id">{{blogMeta.blogTitle}}</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="tertiary" class="accent-bar">
      <button
        type="button"
        aria-label="Toggle sidenav"
        mat-icon-button
        (click)="drawer.toggle()"
        *ngIf="isHandset$ | async">
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      <span>Blogging</span>
    </mat-toolbar>
    <app-blog></app-blog>
  </mat-sidenav-content>
</mat-sidenav-container>
