<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
               [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
               [mode]="(isHandset$ | async) ? 'over' : 'side'"
               [opened]="(isHandset$ | async) === false">
    <mat-toolbar>
    </mat-toolbar>
    <mat-nav-list>
      @if (authService.isAuthenticated()) {
        <a mat-list-item (click)="showBlogForm()">Write new blog</a>
      }
    </mat-nav-list>
    <hr/>
    Blogs
    <mat-nav-list>
      @for (blogMeta of blogListResource.value().results; track blogMeta.id) {
        <a mat-list-item [href]="'/blog/'+blogMeta.id">{{blogMeta.blogTitle}}</a>
      }
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="tertiary" class="accent-bar">
      @if (isHandset$ | async) {
        <button
          type="button"
          aria-label="Toggle sidenav"
          mat-icon-button
          (click)="drawer.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      }
      <div class="top-bar">
        <span>Blogging</span>
        @if (!authService.isAuthenticated()) {
          <button mat-button (click)="authService.login()">
            Login
          </button>
        }
        @if (authService.isAuthenticated()) {
          <button mat-button (click)="authService.logout()">
            Logout
          </button>
        }
      </div>
    </mat-toolbar>
    <div style="height: 100%;"><ng-content></ng-content></div>
  </mat-sidenav-content>
</mat-sidenav-container>
